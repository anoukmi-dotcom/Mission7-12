<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexiPulse - Frans Woordenschat Trainer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://jsdelivr.net"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background-color: #FFFAF0; color: #111827; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .perspective { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-8">

    <!-- Header -->
    <header class="w-full max-w-4xl mx-auto mb-8 text-center bg-white border-[6px] border-[#111827] rounded-3xl p-6 shadow-[8px_8px_0_#F97316]">
        <h1 class="font-display font-900 text-4xl md:text-5xl text-[#111827] uppercase tracking-tight">⚡ LexiPulse</h1>
        <p class="font-display font-700 text-lg md:text-xl text-[#F97316] mt-2">Frans Woordenschat Trainer</p>
        <p class="text-sm text-[#4B5563] mt-1">Interactieve Flashcards & Quizzen voor Mission 7 t/m 12</p>
    </header>

    <!-- Main Content App -->
    <main id="app-root" class="w-full max-w-4xl mx-auto flex-1 flex flex-col items-center justify-center">
        <!-- De app wordt dynamisch geladen via JavaScript -->
        <div class="text-center py-12">
            <p class="text-xl font-bold">App aan het laden...</p>
        </div>
    </main>

    <!-- Data & App Logic -->
    <script>
        // Woordenschat data gebaseerd op jouw specificaties
        const vocabularyData = {
            mission_7: [
                { id: "m7_age", french: "un âge", dutch: "een leeftijd" },

                { id: "m7_mois", french: "un mois", dutch: "een maand" },

                { id: "m7_numéro", french: "un nummer", dutch: "een nummer" },
                { id: "m7_prénom", french: "un prénom", dutch: "een voornaam" },
                { id: "m7_téléphone", french: "un téléphone", dutch: "een telefoon" },
                { id: "m7_adresse", french: "une adresse", dutch: "een adres" },

                { id: "m7_donner", french: "donner", dutch: "geven" },

                { id: "m7_chez_moi", french: "chez moi", dutch: "bij mij thuis" },
                { id: "m7_pour_toi", french: "pour toi", dutch: "voor jou" },
                { id: "m7_peut_être", french: "peut-être", dutch: "misschien" },
                { id: "m7_pourquoi", french: "pourquoi?", dutch: "waarom?" },
                { id: "m7_quand", french: "quand?", dutch: "wanneer?" },
                { id: "m7_quel", french: "quel, quelle?", dutch: "welk, welke?" },
                { id: "m7_bientot", french: "À bientôt!", dutch: "Tot binnenkort!" },
                { id: "m7_demain", french: "À demain", dutch: "Tot morgen!" },
                { id: "m7_a_la_maison", french: "à la maison", dutch: "thuis" },
                { id: "m7_allo", french: "Allo!", dutch: "Hallo! (telefoon)" },
                { id: "m7_ca_va", french: "(Comment) ça va?", dutch: "Hoe gaat het?" },
                { id: "m7_ca_va_bien", french: "ça va bien.", dutch: "het gaat goed." },
                { id: "m7_daccord", french: "D'accord!", dutch: "Akkoord! / Oké!" },
                { id: "m7_bruxelles", french: "J'habite à Bruxelles.", dutch: "Ik woon in Brussel." },
                { id: "m7_adresse_num", french: "J'habite rue de la Poste au numéro 6.", dutch: "Ik woon in de Poststraat op nummer 6." },
                { id: "m7_madame", french: "madame", dutch: "mevrouw" },
                { id: "m7_monsieur", french: "monsieur", dutch: "meneer" },
                { id: "m7_quel_nom", french: "Quel ist ton nom?", dutch: "Wat is je naam?" },
                { id: "m7_janvier", french: "janvier", dutch: "januari" },
                { id: "m7_fevrier", french: "février", dutch: "februari" },
                { id: "m7_mars", french: "mars", dutch: "maart" },
                { id: "m7_avril", french: "avril", dutch: "april" },
                { id: "m7_mai", french: "mai", dutch: "mei" },
                { id: "m7_juin", french: "juin", dutch: "juni" },
                { id: "m7_juillet", french: "juillet", dutch: "juli" },
                { id: "m7_aout", french: "aout", dutch: "augustus" },
                { id: "m7_septembre", french: "septembre", dutch: "september" },
                { id: "m7_octobre", french: "octobre", dutch: "oktober" },
                { id: "m7_novembre", french: "novembre", dutch: "november" },
                { id: "m7_decembre", french: "décembre", dutch: "december" }
            ],
            mission_8: [
                { id: "m8_beurre", french: "le beurre", dutch: "de boter" },
                { id: "m8_champignon", french: "un champignon", dutch: "een champignon" },
                { id: "m8_coca", french: "un coca", dutch: "een cola" },
                { id: "m8_fromage", french: "le fromage", dutch: "de kaas" },
                { id: "m8_fruit", french: "un fruit", dutch: "een fruit / een stuk fruit" },
                { id: "m8_jambon", french: "le jambon", dutch: "de ham" }
            ]
        };

        const missions = [
            { id: 7, key: "mission_7", name: "Mission 7", title: "Quelle est ton adresse?", desc: "Persoonlijke info, maanden en adressen", color: "bg-[#FEF9C3] border-[#EAB308] shadow-[#FEF08A]" },
            { id: 8, key: "mission_8", name: "Mission 8", title: "Tu manges quoi?", desc: "Eten, drinken, fruit en groenten", color: "bg-[#DCFCE7] border-[#16A34A] shadow-[#166534]" }
        ];

        // State management
        let currentView = 'menu'; // menu, flashcards, quiz
        let selectedMission = null;
        let currentWordIndex = 0;
        let isCardFlipped = false;
        let quizQuestions = [];
        let quizScore = 0;
        let selectedQuizAnswer = null;
        let quizAnswered = false;

        const appRoot = document.getElementById('app-root');

        // Spraakfunctie
        function speakFrench(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                // Verwijder tekst tussen haakjes voor betere uitspraak
                const cleanText = text.replace(/\\([^)]*\\)/g, "").trim();
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Render functies
        function render() {
            if (currentView === 'menu') {
                renderMenu();
            } else if (currentView === 'flashcards') {
                renderFlashcards();
            } else if (currentView === 'quiz') {
                renderQuiz();
            }
        }

        function renderMenu() {
            let html = `
                <div class="w-full text-center mb-6">
                    <h2 class="font-display font-900 text-2xl uppercase mb-6">Kies een Mission om te oefenen:</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full px-4">
            `;

            missions.forEach(mission => {
                html += `
                    <div class="border-[6px] border-[#111827] ${mission.color} rounded-[36px] p-6 shadow-[6px_6px_0_#111827] flex flex-col justify-between">
                        <div>
                            <span class="inline-block bg-[#111827] text-white px-4 py-1 rounded-full text-xs font-bold uppercase mb-2">${mission.name}</span>
                            <h3 class="font-display font-900 text-xl text-[#111827]">${mission.title}</h3>
                            <p class="text-sm text-[#4B5563] mt-1">${mission.desc}</p>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mt-6">
                            <button onclick="startFlashcards('${mission.key}')" class="bg-[#F97316] text-white border-4 border-[#111827] font-display font-700 px-4 py-2 rounded-2xl shadow-[4px_4px_0_#111827] active:translate-x-1 active:translate-y-1 active:shadow-none transition-all cursor-pointer text-sm uppercase">📇 Kaarten</button>
                            <button onclick="startQuiz('${mission.key}')" class="bg-[#22C55E] text-white border-4 border-[#111827] font-display font-700 px-4 py-2 rounded-2xl shadow-[4px_4px_0_#111827] active:translate-x-1 active:translate-y-1 active:shadow-none transition-all cursor-pointer text-sm uppercase">🎯 Quiz</button>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            appRoot.innerHTML = html;
        }

        function renderFlashcards() {
            const words = vocabularyData[selectedMission];
            if (!words || words.length === 0) return;
